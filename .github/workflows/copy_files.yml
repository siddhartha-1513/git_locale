name: Copy Files

on:
  workflow_dispatch:
    inputs:
      source_directory:
        description: "Source directory"
        required: true
        type: string

      destination_directory:
        description: "Destination directory"
        required: true
        type: string

permissions:
  contents: write

jobs:
  copy_files:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files
        shell: bash
        env:
          SOURCE: "${{ inputs.source_directory }}"
          DESTINATION: "${{ inputs.destination_directory }}"
        run: |
          set -e

          echo "Source      : $SOURCE"
          echo "Destination : $DESTINATION"

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: Source directory does not exist."
            exit 1
          fi

          if [ ! -d "$DESTINATION" ]; then
            echo "ERROR: Destination directory does not exist."
            exit 1
          fi

          cp -r "$SOURCE"/. "$DESTINATION"/

          echo "Files copied successfully."

      - name: Commit changes
        shell: bash
        run: |

          git config user.name siddhartha-1513
          git config user.email sharmasiddhartha998@gmail.com

          git add "${{ inputs.destination_directory }}"

          if git diff --cached --quiet; then
            echo "No changes to commit; files are already up to date"
            exit 0
          if

          git commit -m "Copy files from release"

          git push
