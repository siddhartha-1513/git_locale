name: hello_wfl
on:
  workflow_dispatch:
    inputs:
      user_input:
        description: User Input
        required: true
        default: dev
        type: choice
        options:
          - dev
          - int
          - tst
          - prd
      
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: hello step
        run: |
          echo "Hello World, I'am ${{ vars.USER_NAME }}."
          echo "Hello World, I'am ${{ secrets.PSEUDO_SET }}."
          echo "steps Context ${{ toJson(github) }}"
      - name: Checkt-out Repo
        uses: actions/checkout@v4
        
      - name: GitHub-Commad
        run: |
          cat index.html
          echo "git status"
          git status
          echo "git branch"
          git branch -a

